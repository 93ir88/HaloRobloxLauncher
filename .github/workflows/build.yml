name: Build Debug APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/nicklockwood/SwiftFormat/master/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar.tmp 2>/dev/null || true
          # Use official Gradle wrapper bootstrap instead
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 \
            --distribution-type bin
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-roblox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
