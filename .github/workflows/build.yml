name: Build Debug APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 \
            --distribution-type bin
          chmod +x gradlew

      - name: Bundle Delta APK into assets
        run: |
          mkdir -p app/src/main/assets
          echo "Downloading Delta APK..."
          curl -L --retry 5 --retry-delay 3 \
            "https://delta.filenetwork.vip/file/Delta-2.736.1408-02.apk" \
            -o app/src/main/assets/roblox_delta.apk
          echo "Bundled APK size: $(du -sh app/src/main/assets/roblox_delta.apk | cut -f1)"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-roblox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
