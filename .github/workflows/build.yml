name: Build Halo APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -fsSL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar
          curl -fsSL \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
            -o apktool && chmod +x apktool
          echo "apktool $(java -jar apktool.jar --version)" 

      - name: Download Delta APK
        run: |
          echo "Downloading Delta APK …"
          curl -L --retry 5 --retry-delay 3 \
            "https://delta.filenetwork.vip/file/Delta-2.736.1408-02.apk" \
            -o delta.apk
          echo "Downloaded: $(du -sh delta.apk | cut -f1)"

      - name: Decode APK with apktool
        run: |
          java -jar apktool.jar d delta.apk -o decoded --force
          echo "Decoded OK — contents:"
          ls decoded/

      - name: Inject Halo launcher
        run: python3 patch/inject.py decoded patch

      - name: Rebuild APK with apktool
        run: |
          java -jar apktool.jar b decoded -o halo_unsigned.apk --force-all
          echo "Built: $(du -sh halo_unsigned.apk | cut -f1)"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias halo \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Halo, OU=Launcher, O=Halo, L=Earth, S=Earth, C=US"

      - name: Zipalign
        run: |
          BTDIR="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)"
          echo "Using build-tools: $BTDIR"
          $BTDIR/zipalign -v -p 4 halo_unsigned.apk halo_aligned.apk

      - name: Sign APK
        run: |
          BTDIR="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)"
          $BTDIR/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias halo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Halo-Roblox-debug.apk \
            halo_aligned.apk
          echo "Final APK: $(du -sh Halo-Roblox-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Halo-Roblox-debug
          path: Halo-Roblox-debug.apk
          retention-days: 7
