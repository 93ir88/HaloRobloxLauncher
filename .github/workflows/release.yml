name: Release Halo APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -fsSL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -o apktool.jar
          curl -fsSL \
            "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
            -o apktool && chmod +x apktool

      - name: Download Delta APK
        run: |
          curl -L \
            --retry 5 --retry-delay 5 \
            --max-time 600 \
            -A "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.6099.230 Mobile Safari/537.36" \
            -H "Accept: application/octet-stream,application/vnd.android.package-archive,*/*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Connection: keep-alive" \
            "https://download2447.mediafire.com/aitsewkf8klg_J0V2qdGTb_ctax3XciEiqB9h12c6Aj4VhD5mkUkjv4u2rU-hQSGWRUdYBRnXh9MAugl9aA2YJKhsg5NZWYQLqgr4auH5Akd91OpQm9HzeFKQlqTgBKxfE1gNihNcPaH8atatCdAb6B-lAzGEJ-KasoOdckoESnhiX4/tom870kvtc5a3sg/Delta-2.736.1408-02.apk" \
            -o delta.apk

          FILETYPE=$(file -b delta.apk | head -c 30)
          SIZE=$(stat -c%s delta.apk)
          echo "Downloaded: $(du -sh delta.apk | cut -f1) — type: $FILETYPE"

          if echo "$FILETYPE" | grep -qi "html\|text\|ASCII"; then
            echo "::error::Got HTML — hotlink blocked"
            head -5 delta.apk
            exit 1
          fi

          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::Too small (${SIZE} bytes)"
            exit 1
          fi

      - name: Decode APK
        run: java -jar apktool.jar d delta.apk -o decoded --force

      - name: Inject Halo launcher
        run: python3 patch/inject.py decoded patch

      - name: Rebuild APK
        run: java -jar apktool.jar b decoded -o halo_unsigned.apk --force-all

      - name: Sign with release keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > release.keystore
          BTDIR="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)"
          $BTDIR/zipalign -v -p 4 halo_unsigned.apk halo_aligned.apk
          VERSION="${GITHUB_REF#refs/tags/}"
          $BTDIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "Halo-Roblox-${VERSION}.apk" halo_aligned.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "☠️🥀 Halo Roblox ${{ env.VERSION }}"
          body: |
            ## Halo Roblox Launcher ${{ env.VERSION }}
            Modified Delta APK — `com.roblox.client` package untouched.

            ### Install
            1. Uninstall existing Roblox first
            2. Download APK
            3. Enable **Install from unknown sources**
            4. Install ☠️
          files: Halo-Roblox-${{ env.VERSION }}.apk
